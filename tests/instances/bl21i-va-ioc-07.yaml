# yaml-language-server: $schema=https://github.com/epics-containers/ioc-generic/releases/latest/download/ibek.ioc.schema.json

# Converted from the builder XML /dls_sw/work/R3.14.12.7/support/BL21I-BUILDER/etc/makeIocs/BL21I-VA-IOC-07.xml
# with builder2ibek bb7ba9e xml2yaml.
# Changed, so that nobody running this test reaches a real device:
# - 1 device address replaced with 127.0.0.1: the EPICS_CA_ADDR_LIST broadcast
#   address; no secrets
# - the value NO quoted, so that YAML 1.1 tools read it as a string, as
#   ibek does
# tests/run-tests.sh runs it with start.sh --test, which generates the
# runtime assets but does not launch the IOC.

ioc_name: "{{ _global.get_env('IOC_NAME') }}"

description: auto-generated by https://github.com/epics-containers/builder2ibek

entities:

  - type: epics.EpicsEnvSet
    name: EPICS_TZ
    value: GMT0BST

  - type: epics.EpicsEnvSet
    name: STREAM_PROTOCOL_PATH
    value: /epics/runtime/protocol/

  - type: devIocStats.iocAdminSoft
    IOC: '{{ ioc_name | upper }}'

  - type: epics.EpicsEnvSet
    name: EPICS_CA_AUTO_ADDR_LIST
    value: 'NO'

  - type: epics.EpicsEnvSet
    name: EPICS_CA_ADDR_LIST
    value: 127.0.0.1

  - type: autosave.Autosave
    P: 'BL21I-VA-IOC-07:'

  - type: pvlogging.PvLogging
    access_file: /epics/support/pvlogging/src/access.acf
